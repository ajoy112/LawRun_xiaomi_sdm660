name: Build LawRun Lavender BakaSU Latest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Ganti KernelSU Lama ke BakaSU Terbaru (Nomount Support)
        run: |
          rm -rf KernelSU drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Kconfig drivers/Makefile
          # Tambahkan opsi nomount atau argumen sesuai kebutuhan skrip BakaSU
          curl -LSs "https://raw.githubusercontent.com/BakaSU/BakaSU/main/kernelsetup.sh" | bash -s main nomount

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out LawRun_defconfig
          make -j$(nproc) O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package AnyKernel3
        run: |
          AK3_PATH="osm0sis/AnyKernel3.git"
          git clone --depth=1 "https://github.com/$AK3_PATH" AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 ../LawRun-Lavender-BakaSU.zip *

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: LawRun-Lavender-BakaSU.zip
          token: ${{ secrets.GITHUB_TOKEN }}
