
name: Build LawRun Lavender BakaSU Latest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build LawRun Kernel
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout source
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            gnupg \
            gperf \
            libelf-dev \
            liblz4-tool \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler

      # 3. Install BakaSU
      - name: Install BakaSU Latest
        run: |
          set -euo pipefail

          echo "Removing old KernelSU..."

          rm -rf KernelSU
          rm -rf drivers/kernelsu

          sed -i '/kernelsu/d' drivers/Makefile
          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig

          echo "Downloading official BakaSU..."

          curl -fLSs \
            "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" \
            | bash

          echo "Checking BakaSU installation..."

          test -d KernelSU/kernel
          test -L drivers/kernelsu

          echo "BakaSU installation successful!"

      # 4. Configure kernel
      - name: Configure Kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          echo "Loading LawRun defconfig..."

          make O=out LawRun_defconfig

          echo "Enabling BakaSU..."

          scripts/config --file out/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK

          make O=out olddefconfig

          echo "Checking BakaSU configuration..."

          grep -q '^CONFIG_KSU=y' out/.config

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y' out/.config

          echo "BakaSU configuration enabled!"

      # 5. Compile kernel with error logging
      - name: Compile Kernel
        run: |
          set -uo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          echo "=================================="
          echo "STARTING LAWRUN KERNEL BUILD"
          echo "=================================="

          if ! make -j"$(nproc)" O=out \
            CC=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb 2>&1 | tee build.log; then

            echo "=================================="
            echo "KERNEL BUILD FAILED"
            echo "=================================="

            echo "Searching for actual errors..."

            grep -in -B 8 -A 12 -E \
              'error:|fatal error:|undefined reference|No such file|No rule to make target|Killed|Error [0-9]' \
              build.log | tail -n 160 || true

            echo "=================================="
            echo "LAST 100 LINES"
            echo "=================================="

            tail -n 100 build.log

            exit 1
          fi

          echo "=================================="
          echo "KERNEL BUILD SUCCESSFUL"
          echo "=================================="

          test -s out/arch/arm64/boot/Image.gz-dtb

      # 6. Upload build logs
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LawRun-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      # 7. Package AnyKernel3
      - name: Package AnyKernel3
        run: |
          set -euo pipefail

          echo "Downloading AnyKernel3..."

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          echo "Removing Git metadata..."

          rm -rf AnyKernel3/.git

          echo "Preparing AnyKernel3..."

          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' \
            AnyKernel3/anykernel.sh

          sed -i \
            's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' \
            AnyKernel3/anykernel.sh

          echo "Copying kernel image..."

          cp out/arch/arm64/boot/Image.gz-dtb \
            AnyKernel3/Image.gz-dtb

          echo "Creating flashable ZIP..."

          cd AnyKernel3

          zip -r9 \
            "$GITHUB_WORKSPACE/LawRun-Lavender-BakaSU.zip" .

          cd "$GITHUB_WORKSPACE"

          test -s LawRun-Lavender-BakaSU.zip

          echo "AnyKernel3 package successful!"

      # 8. Upload GitHub Release
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LawRun Lavender BakaSU Latest ${{ github.run_number }}
          body: |
            LawRun Kernel for Xiaomi Redmi Note 7 (Lavender).

            Features:
            - BakaSU Latest
            - ARM64 Architecture
            - Clang Compiler
            - AnyKernel3 Installer

            Built with GitHub Actions.
          files: LawRun-Lavender-BakaSU.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
